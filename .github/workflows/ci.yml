name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify static source and build
        run: npm test

      - name: Install browser for responsive checks
        run: npx playwright install --with-deps chromium

      - name: Verify responsive layout and interactions
        run: npm run verify:sites

      - name: Upload browser verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: reference/sites-current/
          if-no-files-found: ignore
